name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/dorskfr/eqls:${{ steps.version.outputs.version }}
            ghcr.io/dorskfr/eqls:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  daemon:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binary: target/release/eqld.exe
            asset: eqld-windows-x86_64.exe
          - os: macos-latest
            binary: target/release/eqld
            asset: eqld-macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release -p eqld

      - name: Upload binary to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          BINARY: ${{ matrix.binary }}
          ASSET: ${{ matrix.asset }}
        run: |
          cp "$BINARY" "$ASSET"
          gh release create "$TAG" --generate-notes || true
          gh release upload "$TAG" "$ASSET" --clobber
