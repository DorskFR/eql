name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/dorskfr/eqls:${{ steps.version.outputs.version }}
            ghcr.io/dorskfr/eqls:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  log-reader:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check upstream out at the pinned commit and patch it
        run: vendor/eql-log-reader/apply.sh "$RUNNER_TEMP/eql-log-reader"

      - name: Build the Windows suite and its installer
        if: runner.os == 'Windows'
        working-directory: ${{ runner.temp }}/eql-log-reader
        run: |
          python -m pip install --upgrade pyinstaller
          python -m PyInstaller --noconfirm --clean eql_suite.spec
          cp icon.png LICENSE README.md "dist/EQL Log Reader/"
          choco install innosetup --no-progress -y
          iscc=$(find "/c/Program Files (x86)" "/c/Program Files" \
            -maxdepth 2 -name ISCC.exe -print -quit)
          "$iscc" installer.iss

      - name: Build the Linux tarball
        if: runner.os == 'Linux'
        working-directory: ${{ runner.temp }}/eql-log-reader
        run: python packaging/linux/build_linux_packages.py

      - name: Upload the log reader to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          BUILT: ${{ runner.temp }}/eql-log-reader/Output
        run: |
          ls -l "$BUILT"
          gh release create "$TAG" --generate-notes || true
          gh release upload "$TAG" "$BUILT"/* --clobber

  daemon:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binary: target/release/eqld.exe
            asset: eqld-windows-x86_64.exe
          - os: macos-latest
            binary: target/release/eqld
            asset: eqld-macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release -p eqld

      - name: Upload binary to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          BINARY: ${{ matrix.binary }}
          ASSET: ${{ matrix.asset }}
        run: |
          cp "$BINARY" "$ASSET"
          gh release create "$TAG" --generate-notes || true
          gh release upload "$TAG" "$ASSET" --clobber
